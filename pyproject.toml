[project]
name = "planificador_yaan"
version = "0.1.0"
description = "PLANIFICADOR YAAN"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "franconv14817096@gmail.com" }
]
dependencies = [
    "flet>=1.0.4"
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.4",
    "flet-desktop>=1.0.4",
    "flet-web>=1.0.4",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.noelfranco"
name = "planificador_yaan"
product_name = "PLANIFICADOR YAAN"
company = "yaan"
copyright = "Copyright (C) 2023-2026 by YAAN"

# Limitación de arquitectura para Android APK
[tool.flet.apk]
arch = ["arm64-v8a, "armeabi-v7a"]

[tool.flet.app]
path = "src"
